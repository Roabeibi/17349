<!DOCTYPE html >
<html lang="es"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crearSaludador</title>
    </head>

    <body>
        <h1>crearSaludador </h1>
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario">
        <button onclick ="crear()">Crear</button>
        <script>
            usuario = document.getElementById("usuario")
            function crear(){
                url = "http://localhost:8081/crearSaludador";
                u = usuario.value
                datos = JSON.stringify({"contenido": u})
                parametros = { method: "POST",body : datos, headers: {"Content-Type": "application/json"} }
                fetch (url,parametros)

                .then(respuesta => {
                    return respuesta.json()
                })
                .then((datos) => {
                    console.log(datos)
                })
                .catch((error) => {
                    console.log(error)
                })
            }
        </script>
</body>
</html>
